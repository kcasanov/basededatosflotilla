name: Sync V3 sources

on:
  push:
    paths:
      - '.github/workflows/sync-v3-sources.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode canonical V3 sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          pairs = [
              ('.v3/app-v3.js.gz.b64', 'app-v3.js'),
              ('.v3/Code_v3.gs.gz.b64', 'Code.gs'),
          ]
          for src, dst in pairs:
              data = Path(src).read_text().strip()
              Path(dst).write_bytes(gzip.decompress(base64.b64decode(data)))
          PY
      - name: Commit synchronized sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v3.js Code.gs
          if git diff --cached --quiet; then
            echo "Sources already synchronized"
          else
            git commit -m "Sync V3 source files"
            git push
          fi
