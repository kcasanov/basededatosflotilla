name: Finalize V3 production

on:
  push:
    branches:
      - main
    paths:
      - 'finalize_v3.py'
      - '.github/workflows/finalize-v3.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run finalizer
        run: python finalize_v3.py

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check app-v3.js
          cp Code.gs /tmp/code-v3.js
          node --check /tmp/code-v3.js

      - name: Commit final production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize V3 production"
          git push
