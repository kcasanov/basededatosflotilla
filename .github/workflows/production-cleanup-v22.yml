name: Production cleanup v2.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-cleanup-v22.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace inline test data with production app
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, re
          from pathlib import Path

          data = ''''''
          Path('app.js').write_bytes(gzip.decompress(base64.b64decode(data)))

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s, count = re.subn(r'<script>.*?</script>', '<script src="/app.js?v=2.2"></script>', s, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected 1 inline script, found {count}')
          s = s.replace('Administración personal · V2.1', 'Administración personal · V2.2')
          s = s.replace('Precarga basada en los planes actuales del Excel. Leyder, Hermano Leyder, Avante Diesel y Spark Negro quedan excluidos para agregarlos luego desde “Nuevo vehículo”.', 'Datos cargados directamente desde Google Sheets.')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-index-login.yml
          rm -f .github/workflows/production-cleanup-v22.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js .github/workflows
          git commit -m "Move fleet app to production data sources"
          git push
