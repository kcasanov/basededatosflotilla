name: Production cleanup v2.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-cleanup-v22.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build clean production frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, re

          encoded = Path('app_v2_2.js.gz.b64').read_text().strip()
          raw = gzip.decompress(base64.b64decode(encoded))
          expected = '3843c4bd3f7a4944db551d442da6af9fc44f6cc2daad71206e8896086b785803'
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'app.js checksum mismatch: {actual}')
          Path('app.js').write_bytes(raw)

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s, count = re.subn(r'<script>.*?</script>', '<script src="/app.js?v=2.2"></script>', s, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected exactly one inline script, found {count}')
          s = s.replace('Administración personal · V2.1', 'Administración personal · V2.2')
          s = s.replace('Precarga basada en los planes actuales del Excel. Leyder, Hermano Leyder, Avante Diesel y Spark Negro quedan excluidos para agregarlos luego desde “Nuevo vehículo”.', 'Datos cargados directamente desde Google Sheets.')
          p.write_text(s, encoding='utf-8')

          t = Path('netlify.toml')
          toml = t.read_text(encoding='utf-8')
          toml = toml.replace('command = "mkdir -p dist && cp index.html dist/index.html"', 'command = "mkdir -p dist && cp index.html app.js dist/"')
          t.write_text(toml, encoding='utf-8')
          PY

          rm -f app_v2_2.js.gz.b64
          rm -f .github/workflows/fix-index-login.yml
          rm -f .github/workflows/production-cleanup-v22.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move fleet app to production-only data sources"
          git push
