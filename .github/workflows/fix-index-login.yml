name: Fix index login startup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-index-login.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove premature renderWeek call
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'renderExpenseConfig();renderWeek();'
          new = 'renderExpenseConfig();'
          if old not in s:
              raise SystemExit('Target line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix login startup order"
          git push
