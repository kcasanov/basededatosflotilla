[build]
  command = "mkdir -p dist && cp index.html app.js app-v3.js central-sync-ui.js session-stability.js performance-v34.js dist/ && sed -i 's/Administración personal · V3.1/Administración personal · V3.4/g' dist/index.html && sed -i 's#</body>#<script src=\"./central-sync-ui.js?v=3.4\"></script><script src=\"./session-stability.js?v=3.4\"></script><script src=\"./performance-v34.js?v=3.4\"></script></body>#' dist/index.html"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
